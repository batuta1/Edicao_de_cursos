<!--titulo: Registro de verificação-->
<section class="card" aria-labelledby="t">
  <span class="rotulo">Mão na massa</span>
  <h1 id="t">Monte o seu registro de verificação</h1>
  <p class="sub">Com a Perplexity aberta no computador, marque o que você vê na tela. O registro se monta sozinho, pronto para copiar.</p>

  <div class="grid" id="campos"></div>

  <div class="item" style="margin-top:12px">
    <h2><label for="div">Divergências em relação à tabela de equivalência</label></h2>
    <input type="text" id="div" placeholder="descreva, ou deixe em branco se não houver">
  </div>

  <div class="item" style="margin-top:12px">
    <label class="chk" style="margin:0;border:0;padding:0">
      <input type="checkbox" id="ponto">
      <span>🏁 Em perplexity.ai, com a conta ativa, a caixa <strong>“O que você quer saber?”</strong> está visível e a barra lateral exibe <strong>Projetos</strong> e o histórico (<strong>Recentes</strong>).</span>
    </label>
  </div>

  <div class="feedback" id="dica" role="status" aria-live="polite"></div>

  <h2 style="margin-top:18px">Seu registro</h2>
  <pre class="saida" id="saida"></pre>
  <div class="opcoes" style="margin-top:10px">
    <button type="button" class="btn principal" id="copiar">Copiar registro</button>
  </div>
  <div class="feedback" id="msgCopia" role="status" aria-live="polite"></div>
  <div class="final" id="final" role="status" aria-live="polite"></div>
</section>

<script>
  // Campos e opções: registro de verificação, tabela de equivalência e tabela de problemas do Módulo 0.
  var CAMPOS = [
    { id: 'conta', rotulo: 'Conta', opcoes: ['e-mail', 'Conta Google', 'sem conta'] },
    { id: 'plano', rotulo: 'Plano', opcoes: ['gratuito', 'outro'] },
    { id: 'idioma', rotulo: 'Idioma da interface', opcoes: ['português', 'inglês', 'misto'] },
    { id: 'caixa', rotulo: 'Rótulos vistos na caixa de pergunta', opcoes: ['Pesquisar', 'Computer', '+', 'Modelo'], multi: true },
    { id: 'lateral', rotulo: 'Rótulos vistos na barra lateral', opcoes: ['Projetos', 'Recentes'], multi: true }
  ];
  var DICAS = {
    'sem conta': 'Sem conta você testa a busca básica, mas não tem histórico, Projetos nem as configurações de privacidade. Crie a conta gratuita antes da lição de segurança e privacidade.',
    'outro': 'Tudo bem: o curso foi feito para o plano gratuito, mas funciona em qualquer plano. Só as cotas mudam.',
    'inglês': 'Interface em inglês: siga a coluna “Inglês” da tabela de equivalência (Search, Pro Search, Projects, Library…) ou ajuste o idioma nas configurações da conta.',
    'misto': 'Normal em 2026: nomes em português e em inglês convivem na tela. Procure a função pela descrição, não pelo nome.'
  };
  var escolha = {};
  var caixa = document.getElementById('campos');

  CAMPOS.forEach(function (c) {
    escolha[c.id] = c.multi ? [] : null;
    var bloco = document.createElement('div'); bloco.className = 'item';
    bloco.innerHTML = '<h2 id="r-' + c.id + '">' + c.rotulo + (c.multi ? ' <span style="font-weight:400;color:var(--suave);font-size:13px">(marque todos que vir)</span>' : '') + '</h2>';
    var grupo = document.createElement('div'); grupo.className = 'opcoes';
    grupo.setAttribute('role', 'group'); grupo.setAttribute('aria-labelledby', 'r-' + c.id);
    c.opcoes.forEach(function (op) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'btn'; b.textContent = op;
      b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', function () {
        if (c.multi) {
          var i = escolha[c.id].indexOf(op);
          if (i >= 0) { escolha[c.id].splice(i, 1); b.setAttribute('aria-pressed', 'false'); }
          else { escolha[c.id].push(op); b.setAttribute('aria-pressed', 'true'); }
        } else {
          escolha[c.id] = op;
          grupo.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
          var d = document.getElementById('dica');
          if (DICAS[op]) { d.textContent = DICAS[op]; d.className = 'feedback info'; } else { d.textContent = ''; d.className = 'feedback'; }
        }
        atualizar();
      });
      grupo.appendChild(b);
    });
    bloco.appendChild(grupo); caixa.appendChild(bloco);
  });

  function hoje() {
    var d = new Date(), z = function (n) { return (n < 10 ? '0' : '') + n; };
    return z(d.getDate()) + '/' + z(d.getMonth() + 1) + '/' + d.getFullYear();
  }
  function v(id, padrao) {
    var x = escolha[id];
    if (Array.isArray(x)) {
      var ordem = CAMPOS.filter(function (c) { return c.id === id; })[0].opcoes;
      return x.length ? ordem.filter(function (o) { return x.indexOf(o) >= 0; }).join(', ') : padrao;
    }
    return x || padrao;
  }
  function atualizar() {
    var div = document.getElementById('div').value.trim();
    document.getElementById('saida').textContent =
      'Data da verificação: ' + hoje() + '\n' +
      'Conta: ' + v('conta', '[e-mail | Conta Google | sem conta]') + '\n' +
      'Plano: ' + v('plano', '[gratuito | outro]') + '\n' +
      'Idioma da interface: ' + v('idioma', '[português | inglês | misto]') + '\n' +
      'Rótulos vistos na caixa de pergunta: ' + v('caixa', '[ex.: Pesquisar, Computer, +, Modelo]') + '\n' +
      'Rótulos vistos na barra lateral: ' + v('lateral', '[ex.: Projetos, Recentes]') + '\n' +
      'Divergências em relação à tabela de equivalência: ' + (div || 'nenhuma');
    var completo = escolha.conta && escolha.plano && escolha.idioma && document.getElementById('ponto').checked;
    if (completo) concluir('final', 'Acesso verificado e registro montado. Copie o registro e guarde-o: ele volta a ser útil sempre que a interface mudar. Você já pode continuar.');
  }
  document.getElementById('ponto').addEventListener('change', atualizar);
  document.getElementById('div').addEventListener('input', atualizar);
  ligarCopia('copiar', 'saida', 'msgCopia', 'Registro');
  atualizar();
</script>
