<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manter, trocar ou retirar?</title>
<style>
  :root {
    --azul: #152f4d; --azul-2: #2b5582; --azul-claro: #e8eef5;
    --areia: #f6f3ee; --tinta: #1d2733; --suave: #55626f; --linha: #d5dde6;
    --ok: #1f7a4d; --ok-claro: #e7f5ee; --erro: #a33a2b; --erro-claro: #fbecea;
    --aviso: #8a5a00; --aviso-claro: #fdf3e1;
    --verde: #1f7a4d; --amarelo: #b07800; --vermelho: #a33a2b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--tinta); line-height: 1.45; font-size: 15px; }
  .card { padding: 24px 20px 22px; border-radius: 18px; background: linear-gradient(180deg, #ffffff 0%, var(--areia) 100%); border: 1px solid var(--linha); }
  .rotulo { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--azul-2); background: var(--azul-claro); padding: 4px 10px; border-radius: 999px; }
  h1 { margin: 12px 0 4px; font-size: 22px; line-height: 1.25; color: var(--azul); }
  h2 { margin: 0 0 6px; font-size: 16px; color: var(--azul); }
  .sub { margin: 0 0 18px; color: var(--suave); }
  .nota { margin: 14px 0 0; font-size: 13px; color: var(--suave); }
  button { font: inherit; }
  .btn { font-size: 14px; font-weight: 600; color: var(--azul); background: #fff; border: 1.5px solid var(--azul-2); border-radius: 999px; padding: 8px 14px; cursor: pointer; transition: background .15s ease; }
  .btn:hover { background: var(--azul-claro); }
  .btn[aria-pressed="true"], .btn.sel { background: var(--azul); border-color: var(--azul); color: #fff; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.principal { background: var(--azul); color: #fff; border-color: var(--azul); }
  .btn.principal:hover { background: var(--azul-2); }
  button:focus-visible, input:focus-visible, label:focus-within { outline: 3px solid #f0b45a; outline-offset: 2px; }
  .opcoes { display: flex; flex-wrap: wrap; gap: 8px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
  .item { background: #fff; border: 1px solid var(--linha); border-radius: 14px; padding: 14px; }
  .item.certo { border-color: var(--ok); box-shadow: inset 4px 0 0 var(--ok); }
  .item.errado { border-color: var(--erro); box-shadow: inset 4px 0 0 var(--erro); }
  .feedback { margin-top: 10px; font-size: 14px; border-radius: 10px; }
  .feedback:empty { display: none; }
  .feedback.ok { background: var(--ok-claro); color: var(--ok); padding: 10px 12px; }
  .feedback.erro { background: var(--erro-claro); color: var(--erro); padding: 10px 12px; }
  .feedback.info { background: var(--azul-claro); color: var(--azul); padding: 10px 12px; }
  .feedback.aviso { background: var(--aviso-claro); color: var(--aviso); padding: 10px 12px; }
  .final { margin-top: 18px; padding: 14px 16px; border-radius: 12px; background: var(--ok-claro); color: var(--ok); font-weight: 600; }
  .final:empty { display: none; }
  .barra { height: 8px; border-radius: 999px; background: var(--azul-claro); overflow: hidden; margin: 4px 0 16px; }
  .barra > span { display: block; height: 100%; width: 0; background: var(--azul); transition: width .25s ease; }
  .saida { white-space: pre-wrap; font-family: Consolas, "Courier New", monospace; font-size: 13.5px; background: #fff; border: 1px dashed var(--azul-2); border-radius: 12px; padding: 14px; margin: 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

</style>
</head>
<body>
<style>
  .caso { margin: 0 0 10px; }
  .caso strong { color: var(--azul); }
</style>
<section class="card" aria-labelledby="t">
  <span class="rotulo">Atividade</span>
  <h1 id="t">Manter, trocar ou retirar?</h1>
  <p class="sub">Toda ficha de auditoria termina numa decisão. Treine antes da ficha real: para cada citação abaixo, decida o que fazer com a frase que ela sustenta.</p>
  <div class="barra" aria-hidden="true"><span id="barra"></span></div>
  <div class="grid" id="casos"></div>
  <div class="final" id="final" role="status" aria-live="polite"></div>
</section>
<script>
  // Ficha de auditoria, dica de fonte primária e "Se travar" da Oficina 3 (roteiro Hands-on).
  var CASOS = [
    ['A frase diz que o art. 20 garante a revisão de decisões automatizadas. A citação leva ao texto compilado da LGPD no planalto.gov.br, e o Ctrl+F acha o trecho.', 'manter',
     'A página existe, é o documento original e tem o trecho: a citação sustenta a frase.'],
    ['A citação leva ao blog de um escritório que comenta o art. 20. O trecho está lá, mas é a explicação do blog, não a lei.', 'trocar',
     'Blog é fonte secundária: bom para contexto, fraco para afirmação decisiva. Troque pela lei no Planalto.'],
    ['A página citada abre, mas o Ctrl+F não acha nenhuma palavra da frase. Você pediu no Thread uma fonte primária e nenhuma veio.', 'retirar',
     'Se a página não tem a frase e a fonte primária não veio, a frase sai.'],
    ['A Perplexity informou órgão julgador, relator e data de um acórdão, citando uma notícia sobre o caso, não o portal do tribunal.', 'trocar',
     'Notícia é fonte secundária. Exija o domínio oficial e confira você mesmo no portal do tribunal.']
  ];
  var ROTULOS = { manter: 'Manter', trocar: 'Trocar', retirar: 'Retirar' };
  var certos = {}, concluido = false, grid = document.getElementById('casos');
  CASOS.forEach(function (u, i) {
    var card = document.createElement('div'); card.className = 'item';
    var p = document.createElement('p'); p.className = 'caso';
    var n = document.createElement('strong'); n.textContent = 'Citação ' + (i + 1) + '. ';
    p.appendChild(n); p.appendChild(document.createTextNode(u[0]));
    var ops = document.createElement('div'); ops.className = 'opcoes'; ops.setAttribute('role', 'group'); ops.setAttribute('aria-label', 'Decisão para a citação ' + (i + 1));
    var fb = document.createElement('div'); fb.className = 'feedback'; fb.setAttribute('aria-live', 'polite');
    Object.keys(ROTULOS).forEach(function (c) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'btn';
      b.textContent = ROTULOS[c]; b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', function () {
        Array.prototype.forEach.call(ops.children, function (x) { x.classList.remove('sel'); x.setAttribute('aria-pressed', 'false'); });
        b.classList.add('sel'); b.setAttribute('aria-pressed', 'true');
        var ok = c === u[1]; certos[i] = ok;
        card.className = 'item ' + (ok ? 'certo' : 'errado');
        fb.className = 'feedback ' + (ok ? 'ok' : 'erro');
        fb.textContent = ok ? 'Correto. ' + u[2] : 'Ainda não. Pergunte-se: a página tem o trecho? É o documento original?';
        atualizar();
      });
      ops.appendChild(b);
    });
    card.appendChild(p); card.appendChild(ops); card.appendChild(fb); grid.appendChild(card);
  });
  function atualizar() {
    var n = 0; for (var k in certos) if (certos[k]) n++;
    document.getElementById('barra').style.width = (100 * n / CASOS.length) + '%';
    if (n === CASOS.length && !concluido) {
      concluido = true;
      document.getElementById('final').textContent = 'Quatro de quatro. Agora faça o mesmo com as duas citações reais da sua resposta da Oficina 2.';
    }
  }
</script>

</body>
</html>
