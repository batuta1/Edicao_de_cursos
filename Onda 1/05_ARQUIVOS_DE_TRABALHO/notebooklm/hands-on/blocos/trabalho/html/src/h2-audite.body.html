<!--titulo: Audite esta citação-->
<style>
  .par { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-bottom: 10px; }
  .lado { border-radius: 12px; padding: 10px 12px; font-size: 14px; }
  .lado small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; color: var(--suave); }
  .gerada { background: var(--azul-claro); }
  .original { background: var(--areia); border-left: 4px solid var(--azul-2); }
  .caso { margin-bottom: 12px; }
  .caso h2 { font-size: 14px; }
  .placar { font-weight: 700; color: var(--azul); margin: 0; }
</style>
<section class="card" aria-labelledby="t">
  <span class="rotulo">Atividade</span>
  <h1 id="t">Audite esta citação</h1>
  <p class="sub">Compare a frase gerada com o trecho que a citação abre e marque na ficha se bate: total, parcial ou não.</p>
  <p class="placar" id="placar" aria-live="polite"></p>
  <div class="barra" aria-hidden="true"><span id="barra"></span></div>
  <div id="casos"></div>
  <p class="nota">Trechos da Lei nº 13.709/2018 (texto compilado do Planalto). As frases geradas são exemplos criados para o exercício.</p>
  <div class="final" id="final" role="status" aria-live="polite"></div>
</section>

<script>
  // Ficha 'Bate? (total / parcial / não)': Oficina 2 do roteiro Hands-on. Trechos: LGPD, art. 5º, I e II, e art. 11, caput.
  var CASOS = [
    { gerada: 'Dado pessoal é a informação relacionada a pessoa natural identificada ou identificável.',
      ref: 'Art. 5º, I', original: 'dado pessoal: informação relacionada a pessoa natural identificada ou identificável;',
      resp: 'total', explica: 'O trecho sustenta a frase inteira, sem acréscimo nem omissão.' },
    { gerada: 'Dado pessoal sensível é aquele sobre a saúde ou a religião de uma pessoa.',
      ref: 'Art. 5º, II', original: 'dado pessoal sensível: dado pessoal sobre origem racial ou étnica, convicção religiosa, opinião política, filiação a sindicato ou a organização de caráter religioso, filosófico ou político, dado referente à saúde ou à vida sexual, dado genético ou biométrico, quando vinculado a uma pessoa natural;',
      resp: 'parcial', explica: 'Saúde e religião estão no trecho, mas a frase reduz a definição a dois exemplos e omite as demais categorias e a condição "quando vinculado a uma pessoa natural".' },
    { gerada: 'A LGPD proíbe o tratamento de dados pessoais sensíveis.',
      ref: 'Art. 11, caput', original: 'O tratamento de dados pessoais sensíveis somente poderá ocorrer nas seguintes hipóteses:',
      resp: 'não', explica: 'O trecho não sustenta a frase: ele estabelece hipóteses em que o tratamento pode ocorrer. A citação existe, mas a afirmação não pode ser usada.' }
  ];
  var DICA = {
    total: 'O trecho sustenta mesmo a frase inteira? Procure algo que a frase acrescentou ou deixou de fora.',
    parcial: 'Releia: o trecho sustenta parte da frase, ou diz outra coisa?',
    'não': 'Há alguma parte da frase que o trecho sustenta?'
  };
  var certos = {}, concluido = false, caixa = document.getElementById('casos');

  CASOS.forEach(function (c, i) {
    var d = document.createElement('div'); d.className = 'item caso';
    d.innerHTML = '<h2 id="c' + i + '">Citação ' + (i + 1) + '</h2>';
    var par = document.createElement('div'); par.className = 'par';
    var a = document.createElement('div'); a.className = 'lado gerada';
    a.innerHTML = '<small>Frase gerada</small>'; a.appendChild(document.createTextNode(c.gerada));
    var b = document.createElement('div'); b.className = 'lado original';
    b.innerHTML = '<small>Trecho original — ' + c.ref + '</small>'; b.appendChild(document.createTextNode('"' + c.original + '"'));
    par.appendChild(a); par.appendChild(b);
    var g = document.createElement('div'); g.className = 'opcoes'; g.setAttribute('role', 'group'); g.setAttribute('aria-labelledby', 'c' + i);
    var fb = document.createElement('div'); fb.className = 'feedback'; fb.setAttribute('aria-live', 'polite');
    ['total', 'parcial', 'não'].forEach(function (op) {
      var bt = document.createElement('button'); bt.type = 'button'; bt.className = 'btn';
      bt.textContent = op.charAt(0).toUpperCase() + op.slice(1); bt.setAttribute('aria-pressed', 'false');
      bt.addEventListener('click', function () {
        g.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === bt ? 'true' : 'false'); });
        if (op === c.resp) { certos[i] = true; d.className = 'item caso certo'; fb.textContent = 'Correto. ' + c.explica; fb.className = 'feedback ok'; }
        else { delete certos[i]; d.className = 'item caso errado'; fb.textContent = 'Ainda não. ' + DICA[op]; fb.className = 'feedback erro'; }
        atualizar();
      });
      g.appendChild(bt);
    });
    d.appendChild(par); d.appendChild(g); d.appendChild(fb); caixa.appendChild(d);
  });

  function atualizar() {
    var n = Object.keys(certos).length;
    document.getElementById('placar').textContent = n + ' de ' + CASOS.length + ' citações conferidas';
    document.getElementById('barra').style.width = (100 * n / CASOS.length) + '%';
    if (n === CASOS.length && !concluido) {
      concluido = true;
      document.getElementById('final').textContent = 'Ficha conferida. Uma citação real pode não sustentar a frase: clicou, leu, comparou — só então use. Você já pode continuar.';
      window.parent.postMessage({ type: 'complete' }, '*');
    }
  }
  atualizar();
</script>
