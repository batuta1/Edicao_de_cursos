<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa da mão na massa</title>
<style>
  :root {
    --azul: #152f4d; --azul-2: #2b5582; --azul-claro: #e8eef5;
    --areia: #f6f3ee; --tinta: #1d2733; --suave: #55626f; --linha: #d5dde6;
    --ok: #1f7a4d; --ok-claro: #e7f5ee; --erro: #a33a2b; --erro-claro: #fbecea;
    --aviso: #8a5a00; --aviso-claro: #fdf3e1;
    --verde: #1f7a4d; --amarelo: #b07800; --vermelho: #a33a2b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--tinta); line-height: 1.45; font-size: 15px; }
  .card { padding: 24px 20px 22px; border-radius: 18px; background: linear-gradient(180deg, #ffffff 0%, var(--areia) 100%); border: 1px solid var(--linha); }
  .rotulo { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--azul-2); background: var(--azul-claro); padding: 4px 10px; border-radius: 999px; }
  h1 { margin: 12px 0 4px; font-size: 22px; line-height: 1.25; color: var(--azul); }
  h2 { margin: 0 0 6px; font-size: 16px; color: var(--azul); }
  .sub { margin: 0 0 18px; color: var(--suave); }
  .nota { margin: 14px 0 0; font-size: 13px; color: var(--suave); }
  button { font: inherit; }
  .btn { font-size: 14px; font-weight: 600; color: var(--azul); background: #fff; border: 1.5px solid var(--azul-2); border-radius: 999px; padding: 8px 14px; cursor: pointer; transition: background .15s ease; }
  .btn:hover { background: var(--azul-claro); }
  .btn[aria-pressed="true"], .btn.sel { background: var(--azul); border-color: var(--azul); color: #fff; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.principal { background: var(--azul); color: #fff; border-color: var(--azul); }
  .btn.principal:hover { background: var(--azul-2); }
  button:focus-visible, input:focus-visible, label:focus-within { outline: 3px solid #f0b45a; outline-offset: 2px; }
  .opcoes { display: flex; flex-wrap: wrap; gap: 8px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
  .item { background: #fff; border: 1px solid var(--linha); border-radius: 14px; padding: 14px; }
  .item.certo { border-color: var(--ok); box-shadow: inset 4px 0 0 var(--ok); }
  .item.errado { border-color: var(--erro); box-shadow: inset 4px 0 0 var(--erro); }
  .feedback { margin-top: 10px; font-size: 14px; border-radius: 10px; }
  .feedback:empty { display: none; }
  .feedback.ok { background: var(--ok-claro); color: var(--ok); padding: 10px 12px; }
  .feedback.erro { background: var(--erro-claro); color: var(--erro); padding: 10px 12px; }
  .feedback.info { background: var(--azul-claro); color: var(--azul); padding: 10px 12px; }
  .feedback.aviso { background: var(--aviso-claro); color: var(--aviso); padding: 10px 12px; }
  .final { margin-top: 18px; padding: 14px 16px; border-radius: 12px; background: var(--ok-claro); color: var(--ok); font-weight: 600; }
  .final:empty { display: none; }
  .barra { height: 8px; border-radius: 999px; background: var(--azul-claro); overflow: hidden; margin: 4px 0 16px; }
  .barra > span { display: block; height: 100%; width: 0; background: var(--azul); transition: width .25s ease; }
  .saida { white-space: pre-wrap; font-family: Consolas, "Courier New", monospace; font-size: 13.5px; background: #fff; border: 1px dashed var(--azul-2); border-radius: 12px; padding: 14px; margin: 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

</style>
</head>
<body>
<style>
  .trilha { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .etapa { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; background: #fff; border: 1px solid var(--linha); border-radius: 14px; padding: 12px 14px; cursor: pointer; text-align: left; width: 100%; color: var(--tinta); }
  .etapa:hover { border-color: var(--azul-2); }
  .etapa[aria-expanded="true"] { border-color: var(--azul); background: var(--azul-claro); }
  .etapa .n { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--azul); color: #fff; font-weight: 700; font-size: 14px; }
  .etapa .nome { font-weight: 700; color: var(--azul); display: block; }
  .etapa .prob { font-size: 13.5px; color: var(--suave); display: block; }
  .etapa .min { font-weight: 700; color: var(--azul-2); font-size: 14px; white-space: nowrap; }
  .etapa .lic { display: inline-block; margin-top: 4px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ok); }
  .detalhe { grid-column: 2 / -1; font-size: 14px; color: var(--azul); margin-top: 4px; }
  .detalhe[hidden] { display: none; }
  .total { display: flex; justify-content: space-between; margin-top: 12px; padding: 10px 14px; border-radius: 12px; background: var(--azul); color: #fff; font-weight: 700; }
</style>
<section class="card" aria-labelledby="t">
  <span class="rotulo">Mapa</span>
  <h1 id="t">O mapa da mão na massa</h1>
  <p class="sub">As oficinas usam o mesmo notebook, em sequência: cada uma entrega uma pequena vitória, e o Projeto Final junta todas num tema seu. Clique numa etapa para ver o que você vai entregar.</p>
  <ol class="trilha" id="trilha"></ol>
  <div class="total"><span>Total</span><span>115 min</span></div>
</section>

<script>
  // Tabela "O Mapa da Mão na Massa" do roteiro Hands-on; entregas tiradas dos pontos de controle de cada oficina.
  var ROT = ['0', '1', '2', '3', '4', 'PF', '10'];
  var ETAPAS = [
    { n: 'Antes de Arregaçar as Mangas', p: '"Posso subir qualquer documento?"', m: 13, l: 'Lição 1', e: 'Conta conferida, Kit LGPD à mão e o semáforo para decidir o que sobe.' },
    { n: 'Oficina 1 — Junte tudo num notebook', p: 'Tenho documentos demais e nenhum lugar para juntá-los', m: 20, l: 'Lição 1', e: 'Notebook "LGPD — revisão" com quatro fontes marcadas e conferidas.' },
    { n: 'Oficina 2 — Pergunte e confira a citação', p: 'Preciso de resposta rápida, mas que eu consiga conferir', m: 20, l: 'Lição 2', e: 'Ficha com três citações conferidas e uma nota salva.' },
    { n: 'Oficina 3 — Gere guia de estudo, resumo e teste', p: 'Quero estudar (ou dar aula) sem reler tudo', m: 20, l: 'Lição 2', e: 'Guia de estudo, documento de resumo e teste, com um item de cada conferido.' },
    { n: 'Oficina 4 — Ouça suas fontes e mostre para alguém', p: 'Quero ouvir o conteúdo e mostrar para outra pessoa', m: 20, l: 'Lição 3', e: 'Resumo em Áudio em português, mapa mental e decisão de compartilhamento anotada.' },
    { n: 'Projeto Final — O kit de estudo do seu tema', p: 'Repetir tudo sozinho, num tema seu', m: 16, l: 'Lição 3', e: 'Notebook novo num tema seu, com fontes verdes, pergunta-chave conferida e um artefato revisado.' },
    { n: 'A Parte dos Dez', p: 'Hábitos para levar', m: 6, l: 'Lição 3', e: 'Dez hábitos que deixam qualquer notebook confiável.' }
  ];
  var lista = document.getElementById('trilha');
  ETAPAS.forEach(function (x, i) {
    var li = document.createElement('li');
    var b = document.createElement('button'); b.type = 'button'; b.className = 'etapa'; b.setAttribute('aria-expanded', 'false');
    b.setAttribute('aria-controls', 'd' + i);
    b.innerHTML = '<span class="n">' + ROT[i] + '</span><span><span class="nome"></span><span class="prob"></span><span class="lic"></span></span><span class="min"></span><span class="detalhe" hidden></span>';
    b.querySelector('.nome').textContent = x.n;
    b.querySelector('.prob').textContent = x.p;
    b.querySelector('.lic').textContent = x.l;
    b.querySelector('.min').textContent = x.m + ' min';
    var d = b.querySelector('.detalhe'); d.id = 'd' + i; d.textContent = 'Você sai com: ' + x.e;
    b.addEventListener('click', function () {
      var aberto = b.getAttribute('aria-expanded') === 'true';
      b.setAttribute('aria-expanded', aberto ? 'false' : 'true'); d.hidden = aberto;
    });
    li.appendChild(b); lista.appendChild(li);
  });
</script>

</body>
</html>
