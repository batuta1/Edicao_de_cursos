<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro de verificação</title>
<style>
  :root {
    --azul: #152f4d; --azul-2: #2b5582; --azul-claro: #e8eef5;
    --areia: #f6f3ee; --tinta: #1d2733; --suave: #55626f; --linha: #d5dde6;
    --ok: #1f7a4d; --ok-claro: #e7f5ee; --erro: #a33a2b; --erro-claro: #fbecea;
    --aviso: #8a5a00; --aviso-claro: #fdf3e1;
    --verde: #1f7a4d; --amarelo: #b07800; --vermelho: #a33a2b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--tinta); line-height: 1.45; font-size: 15px; }
  .card { padding: 24px 20px 22px; border-radius: 18px; background: linear-gradient(180deg, #ffffff 0%, var(--areia) 100%); border: 1px solid var(--linha); }
  .rotulo { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--azul-2); background: var(--azul-claro); padding: 4px 10px; border-radius: 999px; }
  h1 { margin: 12px 0 4px; font-size: 22px; line-height: 1.25; color: var(--azul); }
  h2 { margin: 0 0 6px; font-size: 16px; color: var(--azul); }
  .sub { margin: 0 0 18px; color: var(--suave); }
  .nota { margin: 14px 0 0; font-size: 13px; color: var(--suave); }
  button { font: inherit; }
  .btn { font-size: 14px; font-weight: 600; color: var(--azul); background: #fff; border: 1.5px solid var(--azul-2); border-radius: 999px; padding: 8px 14px; cursor: pointer; transition: background .15s ease; }
  .btn:hover { background: var(--azul-claro); }
  .btn[aria-pressed="true"], .btn.sel { background: var(--azul); border-color: var(--azul); color: #fff; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.principal { background: var(--azul); color: #fff; border-color: var(--azul); }
  .btn.principal:hover { background: var(--azul-2); }
  button:focus-visible, input:focus-visible, label:focus-within { outline: 3px solid #f0b45a; outline-offset: 2px; }
  .opcoes { display: flex; flex-wrap: wrap; gap: 8px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
  .item { background: #fff; border: 1px solid var(--linha); border-radius: 14px; padding: 14px; }
  .item.certo { border-color: var(--ok); box-shadow: inset 4px 0 0 var(--ok); }
  .item.errado { border-color: var(--erro); box-shadow: inset 4px 0 0 var(--erro); }
  .feedback { margin-top: 10px; font-size: 14px; border-radius: 10px; }
  .feedback:empty { display: none; }
  .feedback.ok { background: var(--ok-claro); color: var(--ok); padding: 10px 12px; }
  .feedback.erro { background: var(--erro-claro); color: var(--erro); padding: 10px 12px; }
  .feedback.info { background: var(--azul-claro); color: var(--azul); padding: 10px 12px; }
  .feedback.aviso { background: var(--aviso-claro); color: var(--aviso); padding: 10px 12px; }
  .final { margin-top: 18px; padding: 14px 16px; border-radius: 12px; background: var(--ok-claro); color: var(--ok); font-weight: 600; }
  .final:empty { display: none; }
  .barra { height: 8px; border-radius: 999px; background: var(--azul-claro); overflow: hidden; margin: 4px 0 16px; }
  .barra > span { display: block; height: 100%; width: 0; background: var(--azul); transition: width .25s ease; }
  .saida { white-space: pre-wrap; font-family: Consolas, "Courier New", monospace; font-size: 13.5px; background: #fff; border: 1px dashed var(--azul-2); border-radius: 12px; padding: 14px; margin: 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

</style>
</head>
<body>
<section class="card" aria-labelledby="t">
  <span class="rotulo">Mão na massa</span>
  <h1 id="t">Monte o seu registro de verificação</h1>
  <p class="sub">Com o NotebookLM aberto no computador, marque o que você vê na tela. O registro se monta sozinho, pronto para copiar.</p>

  <div class="grid" id="campos"></div>

  <div class="item" style="margin-top:12px">
    <label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer">
      <input type="checkbox" id="botao" style="width:20px;height:20px;margin-top:2px">
      <span>Em notebook.google.com, a tela inicial exibe o botão <strong>"Criar novo notebook"</strong>.</span>
    </label>
  </div>

  <div class="feedback" id="dica" role="status" aria-live="polite"></div>

  <h2 style="margin-top:18px">Seu registro</h2>
  <pre class="saida" id="saida"></pre>
  <div class="opcoes" style="margin-top:10px">
    <button type="button" class="btn principal" id="copiar">Copiar registro</button>
  </div>
  <div class="feedback" id="msgCopia" role="status" aria-live="polite"></div>
  <div class="final" id="final" role="status" aria-live="polite"></div>
</section>

<script>
  // Campos e opções: Módulo 0 do roteiro (registro de verificação e tabela de problemas).
  var CAMPOS = [
    { id: 'tipo', rotulo: 'Tipo de conta', opcoes: ['pessoal', 'trabalho', 'escolar'] },
    { id: 'nome', rotulo: 'Nome exibido pela ferramenta', opcoes: ['NotebookLM', 'Gemini Notebook', 'os dois'] },
    { id: 'idioma', rotulo: 'Idioma da interface', opcoes: ['português', 'inglês', 'misto'] },
    { id: 'nav', rotulo: 'Navegador no computador', opcoes: ['Chrome', 'Edge', 'Firefox', 'Safari', 'outro'] }
  ];
  var DICAS = {
    trabalho: 'Conta de trabalho: se a tela não abrir, o serviço provavelmente não foi habilitado pelo administrador. Peça ao setor de tecnologia ou siga o curso com uma conta pessoal.',
    escolar: 'Conta escolar: se a tela não abrir, o serviço provavelmente não foi habilitado pelo administrador. Peça ao setor de tecnologia ou siga o curso com uma conta pessoal.',
    'inglês': 'Interface em inglês: ajuste o idioma da Conta Google ou siga os nomes em inglês que o curso indica entre parênteses.',
    misto: 'Interface mista é comum na transição de nome e de tradução. Siga os caminhos do curso a partir de notebook.google.com.',
    'os dois': 'Normal: o produto foi renomeado em 16/07/2026, e os dois nomes ainda aparecem. É a mesma ferramenta.'
  };
  var escolha = {}, concluido = false;
  var caixa = document.getElementById('campos');

  CAMPOS.forEach(function (c) {
    var bloco = document.createElement('div');
    bloco.className = 'item';
    bloco.innerHTML = '<h2 id="r-' + c.id + '">' + c.rotulo + '</h2>';
    var grupo = document.createElement('div');
    grupo.className = 'opcoes';
    grupo.setAttribute('role', 'group');
    grupo.setAttribute('aria-labelledby', 'r-' + c.id);
    c.opcoes.forEach(function (op) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'btn'; b.textContent = op;
      b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', function () {
        escolha[c.id] = op;
        grupo.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
        var d = document.getElementById('dica');
        if (DICAS[op]) { d.textContent = DICAS[op]; d.className = 'feedback info'; } else { d.textContent = ''; d.className = 'feedback'; }
        atualizar();
      });
      grupo.appendChild(b);
    });
    bloco.appendChild(grupo);
    caixa.appendChild(bloco);
  });

  function v(id, padrao) { return escolha[id] || padrao; }
  function atualizar() {
    document.getElementById('saida').textContent =
      'Conta utilizada: [endereço de e-mail]\n' +
      'Tipo de conta: ' + v('tipo', '[pessoal | trabalho | escolar]') + '\n' +
      'Nome exibido pela ferramenta: ' + v('nome', '[NotebookLM | Gemini Notebook]') + '\n' +
      'Idioma da interface: ' + v('idioma', '[português | inglês | misto]') + '\n' +
      'Dispositivo para o curso: computador, navegador ' + v('nav', '[nome]');
    var completo = CAMPOS.every(function (c) { return escolha[c.id]; }) && document.getElementById('botao').checked;
    if (completo && !concluido) {
      concluido = true;
      document.getElementById('final').textContent = 'Acesso verificado e registro montado. Copie o registro, complete o e-mail e guarde-o. Você já pode continuar.';
      window.parent.postMessage({ type: 'complete' }, '*');
    }
  }
  document.getElementById('botao').addEventListener('change', atualizar);

  document.getElementById('copiar').addEventListener('click', function () {
    var texto = document.getElementById('saida').textContent;
    var msg = document.getElementById('msgCopia');
    function falhou() {
      var r = document.createRange(); r.selectNodeContents(document.getElementById('saida'));
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      msg.textContent = ok ? 'Registro copiado.' : 'O texto está selecionado: use Ctrl+C (ou Cmd+C) para copiar.';
      msg.className = 'feedback info';
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(function () { msg.textContent = 'Registro copiado.'; msg.className = 'feedback info'; }, falhou);
    } else { falhou(); }
  });
  atualizar();
</script>

</body>
</html>
