<!--titulo: Semáforo das fontes-->
<style>
  .niv button[data-n="verde"][aria-pressed="true"] { background: var(--verde); border-color: var(--verde); }
  .niv button[data-n="amarelo"][aria-pressed="true"] { background: var(--amarelo); border-color: var(--amarelo); }
  .niv button[data-n="vermelho"][aria-pressed="true"] { background: var(--vermelho); border-color: var(--vermelho); }
  .item p.f { margin: 0 0 10px; font-weight: 600; color: var(--azul); }
  .placar { font-weight: 700; color: var(--azul); }
</style>
<section class="card" aria-labelledby="t">
  <span class="rotulo">Atividade</span>
  <h1 id="t">Semáforo: classifique antes do upload</h1>
  <p class="sub">Para cada fonte, escolha verde, amarelo ou vermelho. Você recebe a correção na hora e pode tentar de novo.</p>
  <p class="placar" id="placar" aria-live="polite"></p>
  <div class="barra" aria-hidden="true"><span id="barra"></span></div>
  <div class="grid" id="lista"></div>
  <div class="final" id="final" role="status" aria-live="polite"></div>
</section>

<script>
  // Exemplos e condutas: Módulo 2 do roteiro (tabela verde/amarelo/vermelho e questão de cenários).
  var FONTES = [
    { t: 'LGPD (Lei nº 13.709/2018), texto compilado no portal do Planalto', n: 'verde', p: 'Lei publicada em portal oficial: material público e oficial. Pode ser usada em qualquer conta.' },
    { t: 'Planilha com nomes e notas da turma, para gerar devolutivas', n: 'vermelho', p: 'Dados pessoais de alunos. Não carregar sem base legal, ambiente institucional aprovado e minimização prévia.' },
    { t: 'Manual interno de procedimentos da sua organização, sem dados pessoais', n: 'amarelo', p: 'Material interno sem dados pessoais: somente em conta institucional autorizada.' },
    { t: 'Guia orientativo da ANPD baixado do portal gov.br', n: 'verde', p: 'Guia de órgão público: material público e oficial, adequado a qualquer conta.' },
    { t: 'Petição inicial de um cliente do escritório', n: 'vermelho', p: 'Documento sob sigilo profissional. Em conta pessoal, não; mesmo no institucional, só com autorização e controles.' },
    { t: 'Artigo científico de acesso aberto', n: 'verde', p: 'Material de acesso aberto: nível verde.' },
    { t: 'Documentos entregues por uma fonte jornalística que pediu sigilo', n: 'vermelho', p: 'Material de fonte jornalística sob sigilo. E lembre: a visualização da conversa não protege as fontes de quem recebe o compartilhamento.' }
  ];
  var NOMES = { verde: 'Verde', amarelo: 'Amarelo', vermelho: 'Vermelho' };
  var certos = {}, concluido = false;
  var lista = document.getElementById('lista');

  FONTES.forEach(function (f, i) {
    var c = document.createElement('div'); c.className = 'item';
    var titulo = document.createElement('p'); titulo.className = 'f'; titulo.id = 'f' + i; titulo.textContent = f.t;
    var g = document.createElement('div'); g.className = 'opcoes niv'; g.setAttribute('role', 'group'); g.setAttribute('aria-labelledby', 'f' + i);
    var fb = document.createElement('div'); fb.className = 'feedback'; fb.setAttribute('aria-live', 'polite');
    ['verde', 'amarelo', 'vermelho'].forEach(function (n) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'btn'; b.textContent = NOMES[n];
      b.setAttribute('data-n', n); b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', function () {
        g.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
        if (n === f.n) {
          certos[i] = true; c.className = 'item certo';
          fb.textContent = 'Correto. ' + f.p; fb.className = 'feedback ok';
        } else {
          delete certos[i]; c.className = 'item errado';
          fb.textContent = 'Não é ' + NOMES[n].toLowerCase() + '. Pense: é público e oficial? É interno? Tem dados pessoais ou sigilo?';
          fb.className = 'feedback erro';
        }
        placar();
      });
      g.appendChild(b);
    });
    c.appendChild(titulo); c.appendChild(g); c.appendChild(fb); lista.appendChild(c);
  });

  function placar() {
    var n = Object.keys(certos).length;
    document.getElementById('placar').textContent = n + ' de ' + FONTES.length + ' classificadas corretamente';
    document.getElementById('barra').style.width = (100 * n / FONTES.length) + '%';
    if (n === FONTES.length && !concluido) {
      concluido = true;
      document.getElementById('final').textContent = 'Todas classificadas. Repare: nas atividades deste curso, só entra material verde. Você já pode continuar.';
      window.parent.postMessage({ type: 'complete' }, '*');
    }
  }
  placar();
</script>
