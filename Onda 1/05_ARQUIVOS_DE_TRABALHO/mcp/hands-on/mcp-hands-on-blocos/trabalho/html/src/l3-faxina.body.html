<!--titulo: Faxina final-->
<style>
  .chk { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
  .chk input { width: 20px; height: 20px; margin-top: 2px; flex: none; }
  .chk small { display: block; color: var(--suave); margin-top: 2px; }
  .lista { display: grid; gap: 10px; }
</style>
<section class="card" aria-labelledby="t">
  <span class="rotulo">Checklist</span>
  <h1 id="t">Faxina final</h1>
  <p class="sub">O último passo do projeto: devolva tudo o que o curso ligou. Marque cada item depois de fazê-lo. Se algo ficar ligado de propósito, anote o motivo no seu plano e marque.</p>
  <div class="barra" aria-hidden="true"><span id="barra"></span></div>
  <div class="lista" id="lista"></div>
  <div class="final" id="final" role="status" aria-live="polite"></div>
</section>
<script>
  // Passo 6 do Projeto Final (roteiro Hands-on).
  var ITENS = [
    ['Removi o OpenAI Docs', 'Claude > Personalizar > Conectores > ⋯ > Remover.'],
    ['Desativei a extensão Filesystem', 'Claude Desktop > Settings > Extensions > Filesystem (rótulo a conferir). Se usei o caminho do Drive: Google Drive > Disconnect.'],
    ['Desconectei o que liguei no teste do projeto', 'Claude > Personalizar > Conectores > [conector] > Disconnect. Se o plano deu vermelho, não houve conexão.'],
    ['Revoguei o acesso do Claude na Conta Google', 'Na área de conexões com apps de terceiros (caminho a conferir).'],
    ['Apaguei a pasta teste-mcp-arquivos', 'No computador e, se usei o caminho do Drive, também no Drive.']
  ];
  var marcados = 0, lista = document.getElementById('lista');
  ITENS.forEach(function (it) {
    var d = document.createElement('div'); d.className = 'item';
    var l = document.createElement('label'); l.className = 'chk';
    var c = document.createElement('input'); c.type = 'checkbox';
    var s = document.createElement('span'); s.textContent = it[0];
    var sm = document.createElement('small'); sm.textContent = it[1]; s.appendChild(sm);
    c.addEventListener('change', function () {
      d.className = c.checked ? 'item certo' : 'item';
      marcados += c.checked ? 1 : -1;
      document.getElementById('barra').style.width = (100 * marcados / ITENS.length) + '%';
      document.getElementById('final').textContent = marcados === ITENS.length
        ? 'Conta limpa. Uma vez por semana, abra Claude > Personalizar > Conectores e pergunte: "ainda preciso de cada um destes?".' : '';
    });
    l.appendChild(c); l.appendChild(s); d.appendChild(l); lista.appendChild(d);
  });
</script>
