<!--titulo: O mapa da mão na massa-->
<style>
  .trilha { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .etapa { display: grid; grid-template-columns: 92px 1fr auto; gap: 12px; align-items: center; background: #fff; border: 1px solid var(--linha); border-radius: 14px; padding: 12px 14px; }
  .degrau { font-size: 10.5px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; text-align: center; border-radius: 10px; padding: 8px 4px; color: #fff; }
  .d-prep { background: var(--suave); }
  .d-consultar { background: var(--verde); }
  .d-ler { background: var(--azul-2); }
  .d-agir { background: var(--amarelo); }
  .d-decidir { background: var(--azul); }
  .etapa h2 { margin: 0; font-size: 15px; }
  .etapa p { margin: 2px 0 0; font-size: 13.5px; color: var(--suave); }
  .tempo { font-weight: 700; color: var(--azul); white-space: nowrap; font-size: 14px; }
  .onde { display: inline-block; margin-top: 4px; font-size: 11.5px; font-weight: 600; color: var(--azul-2); }
  .total { display: flex; justify-content: space-between; margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--azul); color: #fff; font-weight: 700; }
  @media (max-width: 480px) { .etapa { grid-template-columns: 88px 1fr; } .tempo { grid-column: 2; } }
</style>
<section class="card" aria-labelledby="t">
  <span class="rotulo">Mapa do curso</span>
  <h1 id="t">O mapa da mão na massa</h1>
  <p class="sub">As oficinas sobem de risco uma a uma: primeiro consultar, depois ler, depois agir. Cada uma termina com uma vitória e com a conexão desligada.</p>
  <ol class="trilha" id="trilha"></ol>
  <div class="total"><span>Total</span><span>117 min</span></div>
</section>
<script>
  // Tabela "O Mapa da Mão na Massa" do roteiro Hands-on.
  var ETAPAS = [
    ['prep', 'Preparar', 'Antes de arregaçar as mangas', '"O que eu posso ligar?"', 'Lição 1', 13],
    ['consultar', 'Consultar', 'Ligue seu primeiro conector', 'Seu assistente responde de memória, sem fonte', 'Lição 1', 20],
    ['ler', 'Ler', 'Deixe o Claude ler uma pasta — só uma', 'Ler arquivos sem enxergar o resto do computador', 'Lição 2', 20],
    ['ler', 'Ler', 'Consulte sua agenda sem mexer em nada', 'Saber o que tem na agenda sem risco de bagunçá-la', 'Lição 2', 20],
    ['agir', 'Agir', 'Crie, confira e apague', 'O assistente fazer algo por você, com aprovação e desfazer', 'Lição 2', 20],
    ['decidir', 'Decidir', 'Seu plano de conexão segura', 'Decidir sozinho se e como ligar um conector do seu trabalho', 'Lição 3', 18],
    ['prep', 'Levar', 'A parte dos dez', 'Hábitos para levar', 'Lição 3', 6]
  ];
  var ol = document.getElementById('trilha');
  ETAPAS.forEach(function (e) {
    var li = document.createElement('li'); li.className = 'etapa';
    var d = document.createElement('div'); d.className = 'degrau d-' + e[0]; d.textContent = e[1];
    var txt = document.createElement('div');
    var h = document.createElement('h2'); h.textContent = e[2];
    var p = document.createElement('p'); p.textContent = 'Problema: ' + e[3];
    var o = document.createElement('span'); o.className = 'onde'; o.textContent = e[4];
    txt.appendChild(h); txt.appendChild(p); txt.appendChild(o);
    var t = document.createElement('div'); t.className = 'tempo'; t.textContent = e[5] + ' min';
    li.appendChild(d); li.appendChild(txt); li.appendChild(t); ol.appendChild(li);
  });
</script>
