<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Síntese da decisão</title>
<style>
  :root {
    --azul: #152f4d; --azul-2: #2b5582; --azul-claro: #e8eef5;
    --areia: #f6f3ee; --tinta: #1d2733; --suave: #55626f; --linha: #d5dde6;
    --ok: #1f7a4d; --ok-claro: #e7f5ee; --erro: #a33a2b; --erro-claro: #fbecea;
    --aviso: #8a5a00; --aviso-claro: #fdf3e1;
    --verde: #1f7a4d; --amarelo: #b07800; --vermelho: #a33a2b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--tinta); line-height: 1.45; font-size: 15px; }
  .card { padding: 24px 20px 22px; border-radius: 18px; background: linear-gradient(180deg, #ffffff 0%, var(--areia) 100%); border: 1px solid var(--linha); }
  .rotulo { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--azul-2); background: var(--azul-claro); padding: 4px 10px; border-radius: 999px; }
  h1 { margin: 12px 0 4px; font-size: 22px; line-height: 1.25; color: var(--azul); }
  h2 { margin: 0 0 6px; font-size: 16px; color: var(--azul); }
  .sub { margin: 0 0 18px; color: var(--suave); }
  .nota { margin: 14px 0 0; font-size: 13px; color: var(--suave); }
  button { font: inherit; }
  .btn { font-size: 14px; font-weight: 600; color: var(--azul); background: #fff; border: 1.5px solid var(--azul-2); border-radius: 999px; padding: 8px 14px; cursor: pointer; transition: background .15s ease; }
  .btn:hover { background: var(--azul-claro); }
  .btn[aria-pressed="true"], .btn.sel { background: var(--azul); border-color: var(--azul); color: #fff; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.principal { background: var(--azul); color: #fff; border-color: var(--azul); }
  .btn.principal:hover { background: var(--azul-2); }
  button:focus-visible, input:focus-visible, label:focus-within { outline: 3px solid #f0b45a; outline-offset: 2px; }
  .opcoes { display: flex; flex-wrap: wrap; gap: 8px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
  .item { background: #fff; border: 1px solid var(--linha); border-radius: 14px; padding: 14px; }
  .item.certo { border-color: var(--ok); box-shadow: inset 4px 0 0 var(--ok); }
  .item.errado { border-color: var(--erro); box-shadow: inset 4px 0 0 var(--erro); }
  .feedback { margin-top: 10px; font-size: 14px; border-radius: 10px; }
  .feedback:empty { display: none; }
  .feedback.ok { background: var(--ok-claro); color: var(--ok); padding: 10px 12px; }
  .feedback.erro { background: var(--erro-claro); color: var(--erro); padding: 10px 12px; }
  .feedback.info { background: var(--azul-claro); color: var(--azul); padding: 10px 12px; }
  .feedback.aviso { background: var(--aviso-claro); color: var(--aviso); padding: 10px 12px; }
  .final { margin-top: 18px; padding: 14px 16px; border-radius: 12px; background: var(--ok-claro); color: var(--ok); font-weight: 600; }
  .final:empty { display: none; }
  .barra { height: 8px; border-radius: 999px; background: var(--azul-claro); overflow: hidden; margin: 4px 0 16px; }
  .barra > span { display: block; height: 100%; width: 0; background: var(--azul); transition: width .25s ease; }
  .saida { white-space: pre-wrap; font-family: Consolas, "Courier New", monospace; font-size: 13.5px; background: #fff; border: 1px dashed var(--azul-2); border-radius: 12px; padding: 14px; margin: 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

</style>
</head>
<body>
<style>
  .res { margin-top: 14px; background: #fff; border: 1px solid var(--linha); border-radius: 14px; padding: 16px; }
  .res dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 8px 14px; }
  .res dt { font-weight: 600; color: var(--suave); }
  .res dd { margin: 0; }
  .sem { display: inline-block; font-weight: 700; color: #fff; padding: 3px 12px; border-radius: 999px; }
  .sem.verde { background: var(--verde); } .sem.amarelo { background: var(--amarelo); } .sem.vermelho { background: var(--vermelho); }
  .res:empty { display: none; }
  @media (max-width: 480px) { .res dl { grid-template-columns: 1fr; } }
</style>
<section class="card" aria-labelledby="t">
  <span class="rotulo">Consulta rápida</span>
  <h1 id="t">Síntese da decisão</h1>
  <p class="sub">Escolha uma necessidade para ver o caminho sugerido, as permissões iniciais e a cor do semáforo. Use como ponto de partida do seu plano de conexão.</p>
  <div class="opcoes" id="ops" role="group" aria-label="Necessidades"></div>
  <div class="res" id="res" role="status" aria-live="polite"></div>
</section>

<script>
  // Tabela "síntese da decisão" do Módulo 6 do roteiro, sem acréscimos.
  var CASOS = [
    { n: 'Consultar documentação pública', c: 'Conector remoto público, sem login', p: 'Leitura', s: 'verde', t: 'Verde' },
    { n: 'Analisar arquivos que não podem ir para servidor de terceiros', c: 'Extensão local (Claude Desktop), uma pasta', p: 'Leitura; escrita negada', s: 'amarelo', t: 'Amarelo' },
    { n: 'Consultar a própria agenda', c: 'Google Calendar', p: 'Leitura em Always allow; escrita em Needs approval', s: 'amarelo', t: 'Amarelo' },
    { n: 'Redigir respostas de e-mail', c: 'Gmail, somente rascunho', p: 'Envio em Needs approval', s: 'amarelo', t: 'Amarelo' },
    { n: 'Acessar sistema da empresa', c: 'Conector aprovado pela organização', p: 'Definidas pela TI e pelo encarregado de dados', s: 'vermelho', t: 'Vermelho sem autorização' }
  ];
  var ops = document.getElementById('ops'), res = document.getElementById('res');
  CASOS.forEach(function (c) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'btn'; b.textContent = c.n; b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', function () {
      ops.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      res.innerHTML = '';
      var dl = document.createElement('dl');
      [['Necessidade', c.n], ['Caminho sugerido', c.c], ['Permissões iniciais', c.p]].forEach(function (r) {
        var dt = document.createElement('dt'); dt.textContent = r[0]; var dd = document.createElement('dd'); dd.textContent = r[1];
        dl.appendChild(dt); dl.appendChild(dd);
      });
      var dt = document.createElement('dt'); dt.textContent = 'Semáforo';
      var dd = document.createElement('dd'); var s = document.createElement('span'); s.className = 'sem ' + c.s; s.textContent = c.t; dd.appendChild(s);
      dl.appendChild(dt); dl.appendChild(dd); res.appendChild(dl);
    });
    ops.appendChild(b);
  });
</script>

</body>
</html>
