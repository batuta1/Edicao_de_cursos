<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dá para confiar nesta resposta?</title>
<style>
  :root {
    --azul: #152f4d; --azul-2: #2b5582; --azul-claro: #e8eef5;
    --areia: #f6f3ee; --tinta: #1d2733; --suave: #55626f; --linha: #d5dde6;
    --ok: #1f7a4d; --ok-claro: #e7f5ee; --erro: #a33a2b; --erro-claro: #fbecea;
    --aviso: #8a5a00; --aviso-claro: #fdf3e1;
    --verde: #1f7a4d; --amarelo: #b07800; --vermelho: #a33a2b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--tinta); line-height: 1.45; font-size: 15px; }
  .card { padding: 24px 20px 22px; border-radius: 18px; background: linear-gradient(180deg, #ffffff 0%, var(--areia) 100%); border: 1px solid var(--linha); }
  .rotulo { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--azul-2); background: var(--azul-claro); padding: 4px 10px; border-radius: 999px; }
  h1 { margin: 12px 0 4px; font-size: 22px; line-height: 1.25; color: var(--azul); }
  h2 { margin: 0 0 6px; font-size: 16px; color: var(--azul); }
  .sub { margin: 0 0 18px; color: var(--suave); }
  .nota { margin: 14px 0 0; font-size: 13px; color: var(--suave); }
  button { font: inherit; }
  .btn { font-size: 14px; font-weight: 600; color: var(--azul); background: #fff; border: 1.5px solid var(--azul-2); border-radius: 999px; padding: 8px 14px; cursor: pointer; transition: background .15s ease; }
  .btn:hover { background: var(--azul-claro); }
  .btn[aria-pressed="true"], .btn.sel { background: var(--azul); border-color: var(--azul); color: #fff; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.principal { background: var(--azul); color: #fff; border-color: var(--azul); }
  .btn.principal:hover { background: var(--azul-2); }
  button:focus-visible, input:focus-visible, label:focus-within { outline: 3px solid #f0b45a; outline-offset: 2px; }
  .opcoes { display: flex; flex-wrap: wrap; gap: 8px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
  .item { background: #fff; border: 1px solid var(--linha); border-radius: 14px; padding: 14px; }
  .item.certo { border-color: var(--ok); box-shadow: inset 4px 0 0 var(--ok); }
  .item.errado { border-color: var(--erro); box-shadow: inset 4px 0 0 var(--erro); }
  .feedback { margin-top: 10px; font-size: 14px; border-radius: 10px; }
  .feedback:empty { display: none; }
  .feedback.ok { background: var(--ok-claro); color: var(--ok); padding: 10px 12px; }
  .feedback.erro { background: var(--erro-claro); color: var(--erro); padding: 10px 12px; }
  .feedback.info { background: var(--azul-claro); color: var(--azul); padding: 10px 12px; }
  .feedback.aviso { background: var(--aviso-claro); color: var(--aviso); padding: 10px 12px; }
  .final { margin-top: 18px; padding: 14px 16px; border-radius: 12px; background: var(--ok-claro); color: var(--ok); font-weight: 600; }
  .final:empty { display: none; }
  .barra { height: 8px; border-radius: 999px; background: var(--azul-claro); overflow: hidden; margin: 4px 0 16px; }
  .barra > span { display: block; height: 100%; width: 0; background: var(--azul); transition: width .25s ease; }
  .saida { white-space: pre-wrap; font-family: Consolas, "Courier New", monospace; font-size: 13.5px; background: #fff; border: 1px dashed var(--azul-2); border-radius: 12px; padding: 14px; margin: 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

</style>
</head>
<body>
<style>
  .resp { font-style: italic; margin: 0 0 10px; }
  .meta { margin: 0 0 10px; padding: 0; list-style: none; font-size: 14px; }
  .meta li { padding: 4px 0; border-top: 1px dashed var(--linha); }
  .meta b { color: var(--suave); font-weight: 600; }
  .placar { font-weight: 700; color: var(--azul); }
</style>
<section class="card" aria-labelledby="t">
  <span class="rotulo">Atividade</span>
  <h1 id="t">Dá para confiar nesta resposta?</h1>
  <p class="sub">Quatro respostas recebidas depois do pedido “use somente o conector OpenAI Docs”. Para cada uma, olhe o bloco de chamada de ferramenta e a URL devolvida e decida. As respostas são simuladas.</p>
  <p class="placar" id="placar" aria-live="polite"></p>
  <div class="grid" id="lista"></div>
  <div class="final" id="final" role="status" aria-live="polite"></div>
</section>

<script>
  // Critérios: Módulo 3 do roteiro (bloco de chamada de ferramenta, URL e domínios oficiais).
  var CASOS = [
    { r: 'Resume três cuidados de segurança para servidores MCP e cita a página de origem.', tool: 'sim — uma ferramenta do conector OpenAI Docs', url: 'developers.openai.com/…', ok: true,
      fb: 'Chamada do conector registrada e URL em domínio oficial. Ainda assim, abra a URL antes de usar.' },
    { r: 'Explica com segurança o mesmo tema, em tom confiante e bem detalhado.', tool: 'não aparece', url: 'um blog pessoal', ok: false,
      fb: 'Sem bloco de chamada de ferramenta, a resposta pode ter vindo do conhecimento geral do modelo. Ligue o conector na conversa e repita com “use somente o conector”.' },
    { r: 'Traz uma página sobre privacidade de plugins.', tool: 'sim — uma ferramenta do conector OpenAI Docs', url: 'openai-docs-ajuda.exemplo.com/…', ok: false,
      fb: 'O domínio não é um dos oficiais (developers.openai.com, platform.openai.com, learn.chatgpt.com). Peça a fonte exata e confira.' },
    { r: 'Lista três recomendações sobre servidores MCP personalizados.', tool: 'sim — uma ferramenta do conector OpenAI Docs', url: 'platform.openai.com/…', ok: true,
      fb: 'Chamada registrada e domínio oficial. Abra a URL para confirmar que o conteúdo bate com o resumo.' }
  ];
  var certos = {}, concluido = false, lista = document.getElementById('lista');
  CASOS.forEach(function (c, i) {
    var d = document.createElement('div'); d.className = 'item';
    var h = document.createElement('h2'); h.id = 'c' + i; h.textContent = 'Resposta ' + (i + 1);
    var p = document.createElement('p'); p.className = 'resp'; p.textContent = '“' + c.r + '”';
    var ul = document.createElement('ul'); ul.className = 'meta';
    [['Chamada de ferramenta: ', c.tool], ['URL devolvida: ', c.url]].forEach(function (m) {
      var li = document.createElement('li'); var b = document.createElement('b'); b.textContent = m[0]; li.appendChild(b); li.appendChild(document.createTextNode(m[1])); ul.appendChild(li);
    });
    var g = document.createElement('div'); g.className = 'opcoes'; g.setAttribute('role', 'group'); g.setAttribute('aria-labelledby', 'c' + i);
    var fb = document.createElement('div'); fb.className = 'feedback'; fb.setAttribute('aria-live', 'polite');
    [['Pode usar', true], ['Conferir de novo', false]].forEach(function (op) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'btn'; b.textContent = op[0]; b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', function () {
        g.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
        if (op[1] === c.ok) { certos[i] = true; d.className = 'item certo'; fb.className = 'feedback ok'; fb.textContent = 'Correto. ' + c.fb; }
        else { delete certos[i]; d.className = 'item errado'; fb.className = 'feedback erro'; fb.textContent = 'Não. ' + c.fb; }
        placar();
      });
      g.appendChild(b);
    });
    d.appendChild(h); d.appendChild(p); d.appendChild(ul); d.appendChild(g); d.appendChild(fb); lista.appendChild(d);
  });
  function placar() {
    var n = Object.keys(certos).length;
    document.getElementById('placar').textContent = n + ' de ' + CASOS.length + ' decisões corretas';
    if (n === CASOS.length && !concluido) {
      concluido = true;
      document.getElementById('final').textContent = 'Regra prática: sem chamada de ferramenta ou com domínio estranho, não use a resposta até conferir a origem.';
      window.parent.postMessage({ type: 'complete' }, '*');
    }
  }
  placar();
</script>

</body>
</html>
