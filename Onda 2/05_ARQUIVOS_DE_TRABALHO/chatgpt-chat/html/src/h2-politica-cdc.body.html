<script>
  classificador({
    casos: [
      { t: 'Item 1 — desistência em até 3 dias corridos do recebimento, para compras no site.', r: 'conf', p: 'O art. 49 dá 7 dias para desistir de compra feita fora do estabelecimento.' },
