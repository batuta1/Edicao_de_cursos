<!--titulo: Autoavaliação do dossiê-->
<section class="card" aria-labelledby="t">
  <span class="rotulo">Autoavaliação</span>
  <h1 id="t">O seu dossiê está pronto?</h1>
  <p class="sub">Marque cada critério que o seu dossiê atende. O curso só segue quando os seis estiverem marcados — se faltar algum, volte à etapa correspondente antes de continuar.</p>
  <p class="placar" id="placar" aria-live="polite"></p>
  <div class="barra" aria-hidden="true"><span id="barra"></span></div>
  <div id="lista"></div>
  <div class="final" id="final" role="status" aria-live="polite"></div>
</section>
<script>
  checklist([
    'Brief com seis componentes e sem dados pessoais.',
    'Execução registrada (ferramenta, modo, data, plano e edições) ou rota sem cota declarada.',
    'Cinco afirmações centrais com suporte classificado e trecho da fonte.',
    'Números conferidos na fonte primária, sem misturar cortes ou períodos.',
    'Versão corrigida separando fatos, inferências e lacunas.',
    'Configuração de dados registrada e nenhum material sigiloso enviado.'
  ], 'lista', 'placar', 'barra', 'critérios atendidos', function () {
    concluir('final', 'Seis critérios atendidos: o dossiê está completo. Pode continuar.');
  });
</script>
